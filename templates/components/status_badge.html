{% if status == 'submitted' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-800 border border-slate-300">
    <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
    Submitted
  </span>
{% elif status == 'under_review' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-900 border border-amber-300">
    <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
    Under Review
  </span>
{% elif status == 'investigating' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-50 text-sky-900 border border-sky-300">
    <span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>
    Investigating
  </span>
{% elif status == 'resolved' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-900 border border-emerald-300">
    <svg class="w-3 h-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
    Resolved
  </span>
{% elif status == 'closed' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-50 text-red-900 border border-red-300">
    <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
    Closed / Concluded
  </span>
{% else %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-800 border border-slate-300">
    {{ status|title }}
  </span>
{% endif %}
