{% if messages %}
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2" role="region" aria-label="System Notifications">
    {% for message in messages %}
      <div class="alert-box flex items-center justify-between p-4 rounded-md border text-sm transition-all shadow-xs
        {% if message.tags == 'error' %}
          bg-red-50 border-red-200 text-red-800
        {% elif message.tags == 'success' %}
          bg-emerald-50 border-emerald-200 text-emerald-800
        {% elif message.tags == 'warning' %}
          bg-amber-50 border-amber-200 text-amber-800
        {% else %}
          bg-slate-100 border-slate-300 text-slate-800
        {% endif %}"
        role="alert">

        <div class="flex items-center gap-3">
          {% if message.tags == 'error' %}
            <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          {% elif message.tags == 'success' %}
            <svg class="w-5 h-5 text-emerald-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          {% elif message.tags == 'warning' %}
            <svg class="w-5 h-5 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          {% else %}
            <svg class="w-5 h-5 text-slate-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          {% endif %}
          <span class="font-medium">{{ message }}</span>
        </div>

        <button type="button" class="alert-dismiss-btn p-1 text-slate-500 hover:text-slate-800 rounded-sm focus:outline-none focus:ring-1 focus:ring-slate-900" aria-label="Dismiss notification">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
